name: Workflow
on:
  # Checks run on every push/PR to main and dev. Deploy jobs run only on
  # push to main (or a manual Run workflow on main).
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      force_all:
        description: Deploy the portal and the router even if they did not change
        type: boolean
        default: true

concurrency:
  # One production deploy at a time; checks on other branches are unaffected.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SHA: ${{ github.sha }}
  SITE_URL: ${{ vars.SITE_URL || 'https://kofc-15256.org' }}

jobs:
  # Pin the runner image: ubuntu-latest moves to Ubuntu 26 starting
  # 2026-10-19 (actions/runner-images#14748). Stay on 24.04 until we
  # deliberately retest on the new image.
  # Optional E2E is a separate job (not a dynamic matrix include): job-level
  # `if` cannot use `matrix`, and custom `vars.*` in matrix expressions trip
  # the Actions language service when the variable is unset.
  unit:
    name: Unit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'pnpm'

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Runs before the unit tests: the router's tests serve apps/site/out.
      - name: Build static site (split guard)
        run: pnpm --filter site build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://kofc-15256.org

      - name: Unit tests
        run: pnpm turbo test:unit

  e2e:
    name: E2E
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    if: vars.ENABLE_E2E_JOB == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'pnpm'

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --filter web-e2e | grep @playwright | sed 's/.*@//')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec ./apps/e2e/node_modules/.bin/playwright install --with-deps

      - name: Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Supabase Server
        run: pnpm run supabase:web:start -- -x studio,migra,deno-relay,pgadmin-schema-diff,imgproxy,logflare

      - name: Run Next.js Production Build (test env)
        run: pnpm --filter portal build:test

      - name: Run Next.js Server
        run: pnpm --filter portal start:test &

      - name: Run Playwright tests
        run: |
          echo "Running Playwright tests."
          pnpm run test

      - name: Run Supabase tests
        run: pnpm --filter portal supabase:test

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  # Decides which apps to deploy: those turbo reports as affected (including
  # through workspace dependencies) between the last successful deploy and
  # this commit. With no earlier deploy, or when deploy config changed,
  # everything deploys.
  changes:
    needs: [unit, e2e]
    # Workload Identity only trusts refs/heads/main, so a dispatch from any
    # other branch could not deploy anyway. PRs and pushes to `dev` stop here.
    if: >-
      always()
      && needs.unit.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      portal: ${{ steps.affected.outputs.portal }}
      router: ${{ steps.affected.outputs.router }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all }}
          TURBO_TELEMETRY_DISABLED: '1'
        run: |
          all() { echo "portal=true" >> "$GITHUB_OUTPUT"; echo "router=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$FORCE_ALL" = "true" ]; then echo "Forced: deploying everything"; all; fi

          # Newest successful run whose `changes` job actually ran. Prefer this
          # workflow; fall back to the retired deploy.yml for continuity.
          BASE=""
          for WORKFLOW in workflow.yml deploy.yml; do
            for RUN in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null || true); do
              RAN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${RUN%%:*}/jobs" --jq '[.jobs[] | select(.name == "changes" and .conclusion == "success")] | length')
              if [ "$RAN" -gt 0 ]; then BASE=${RUN#*:}; break 2; fi
            done
          done
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier successful deploy: deploying everything"; all
          fi
          echo "Last successful deploy: $BASE"

          if git diff --name-only "$BASE" "$SHA" -- .github/workflows/workflow.yml .github/workflows/deploy.yml infra | grep -q .; then
            echo "Deploy config changed: deploying everything"; all
          fi

          AFFECTED=$(TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$SHA" npx --yes turbo@2.10.8 ls --affected --output=json | jq -r '.packages.items[].name')
          echo "Affected packages:"; echo "$AFFECTED"
          has() { echo "$AFFECTED" | grep -qx "$1"; }

          if has portal; then echo "portal=true" >> "$GITHUB_OUTPUT"; else echo "portal=false" >> "$GITHUB_OUTPUT"; fi
          if has router || has site; then echo "router=true" >> "$GITHUB_OUTPUT"; else echo "router=false" >> "$GITHUB_OUTPUT"; fi

  portal:
    name: Deploy portal
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    # Only this job authenticates to Google Cloud, so only it may mint an OIDC token.
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portal/portal
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
      # GIT_HASH is a build arg because /version is prerendered at build time.
      # NEXT_PUBLIC_SITE_URL is baked in too: email links are built from it.
      - name: Build and push
        run: |
          docker build -f apps/portal/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            --build-arg NEXT_PUBLIC_CAPTCHA_SITE_KEY="${{ vars.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}" \
            --build-arg GIT_HASH="$SHA" \
            -t "$IMAGE:$SHA" .
          docker push "$IMAGE:$SHA"
      # --no-cpu-throttling keeps CPU allocated after the response, so work
      # scheduled with after() (event-email sends) finishes instead of
      # stalling until the next request. The service still scales to zero.
      # Env vars go through --env-vars-file (YAML), not --set-env-vars: From
      # headers like `Name <addr@host>` contain `<`/`>` which break gcloud's
      # dict parser even with a custom delimiter. Email modes default to off;
      # change the repository variables and run this workflow again to switch.
      - name: Deploy to Cloud Run
        env:
          DUES_NOTICES_MODE: ${{ vars.DUES_NOTICES_MODE || 'off' }}
          DUES_NOTICES_FROM: ${{ vars.DUES_NOTICES_FROM }}
          DUES_NOTICES_REPLY_TO: ${{ vars.DUES_NOTICES_REPLY_TO }}
          EVENT_EMAILS_MODE: ${{ vars.EVENT_EMAILS_MODE || 'off' }}
          EVENT_EMAILS_FROM: ${{ vars.EVENT_EMAILS_FROM }}
          EVENT_EMAILS_REPLY_TO: ${{ vars.EVENT_EMAILS_REPLY_TO }}
          EMAIL_ALLOWLIST: ${{ vars.EMAIL_ALLOWLIST }}
        run: |
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$SHA" --format='value(image_summary.digest)')
          python3 -c '
          import os
          def emit(key: str, value: str) -> None:
              escaped = value.replace("\\", "\\\\").replace("\"", "\\\"")
              print(f"{key}: \"{escaped}\"")
          emit("GIT_HASH", os.environ["SHA"])
          for key in (
              "DUES_NOTICES_MODE",
              "DUES_NOTICES_FROM",
              "DUES_NOTICES_REPLY_TO",
              "EVENT_EMAILS_MODE",
              "EVENT_EMAILS_FROM",
              "EVENT_EMAILS_REPLY_TO",
              "EMAIL_ALLOWLIST",
          ):
              emit(key, os.environ.get(key, ""))
          ' > /tmp/portal-env.yaml
          gcloud run deploy portal \
            --image "$IMAGE@$DIGEST" \
            --region us-east4 \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --min-instances 0 --max-instances 3 \
            --cpu 1 --memory 1Gi --no-cpu-throttling \
            --timeout 300 \
            --allow-unauthenticated \
            --env-vars-file=/tmp/portal-env.yaml \
            --set-secrets SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,ORIGIN_AUTH=origin-auth:latest,CAPTCHA_SECRET_TOKEN=captcha-secret-token:latest,RESEND_API_KEY=resend-api-key:latest,RESEND_WEBHOOK_SECRET=resend-webhook-secret:latest,DUES_JOBS_SECRET=dues-jobs-secret:latest

  router:
    name: Deploy router
    needs: [changes, portal]
    # Runs when the portal was skipped (unchanged), never after it failed.
    if: >-
      always() && needs.changes.result == 'success'
      && needs.changes.outputs.router == 'true'
      && needs.portal.result != 'failure' && needs.portal.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      # An empty PORTAL_ORIGIN deploys a router whose portal paths all 500.
      # It is empty only before the portal's first deploy: set it to the
      # Cloud Run URL (runbook 2.4) and run this workflow again.
      - name: Require PORTAL_ORIGIN
        if: vars.PORTAL_ORIGIN == ''
        run: |
          echo "::error::PORTAL_ORIGIN is not set. Set it to the Cloud Run service URL, then run Deploy again (docs/runbook/hosting.md, 2.4)."
          exit 1
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          # Force relative portal links. An empty .env.production value does
          # not always clear the shared .env default during next build.
          NEXT_PUBLIC_PORTAL_URL: ''
      # ROUTER_ENV=production deploys the Worker that owns the custom domain
      # (cutover, runbook section 6); unset deploys the *.workers.dev Worker.
      - run: pnpm --filter router exec wrangler deploy ${{ vars.ROUTER_ENV == 'production' && '--env production' || '' }} --var "PORTAL_ORIGIN:${{ vars.PORTAL_ORIGIN }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
